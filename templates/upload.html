<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Image - Gan2AI Deepfake Detection</title>
    <style>
        .custom-cursor {
    width: 20px; /* عرض الأيقونة */
    height: 20px; /* ارتفاع الأيقونة */
    background-image: url('target.png'); /* رابط الأيقونة */
    background-size: cover;
    position: fixed; /* لجعل المؤشر ثابتًا */
    pointer-events: none; /* لمنع تداخل المؤشر مع العناصر */
    transition: transform 0.1s ease; /* لتنعيم الحركة */
   
    z-index: 9999; /* لجعلها فوق كل العناصر */
}

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
          
        }
/* Cyber Grid Background */
body {
    cursor: url('cursor.png'), auto;
    background-color: #0a0a0a; /* Dark cyber background */
    background-image: radial-gradient(circle at 50% 50%, rgba(0, 255, 255, 0.2) 1%, transparent 20%),
                      radial-gradient(circle at 50% 50%, rgba(255, 0, 255, 0.1) 5%, transparent 25%),
                      repeating-linear-gradient(0deg, rgba(255, 255, 255, 0.05), rgba(255, 255, 255, 0.05) 1px, transparent 1px, transparent 50px),
                      repeating-linear-gradient(90deg, rgba(255, 255, 255, 0.05), rgba(255, 255, 255, 0.05) 1px, transparent 1px, transparent 50px);
    background-size: cover;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background-color: #0a0a0a; /* Dark cyber background */
            overflow: hidden; /* Prevent scrollbars */
            position: relative;
}

@keyframes flicker {
    0%, 100% { opacity: 1; }
    10% { opacity: 0.6; }
    20% { opacity: 0.2; }
    30% { opacity: 0.9; }
    40% { opacity: 0.3; }
    50% { opacity: 0.8; }
    60% { opacity: 0.5; }
    70% { opacity: 1; }
}

h2 {
    animation: flicker 2.5s infinite alternate;
    text-shadow: 0 0 5px rgba(0, 255, 255, 0.7), 0 0 20px rgba(0, 255, 255, 0.4);
}


        main {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            position: relative;
            padding-top: 100px; /* Space for the circle */
        }

        #face-preview-container {
    width: 120px;
    height: 120px;
    background-image: url('DeepGuard (2).gif'); /* Default face detection icon */
    background-size: cover;
    border-radius: 50%;
    border: 4px solid rgb(255, 255, 255); /* Electric blue */
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    position: absolute;
    top: -60px; /* Positioned above the box */
    z-index: 10;
    box-shadow: 0 0 15px rgba(0, 0, 255, 0.5);
    animation: electricPulse 2s infinite ease-in-out, bob 3s infinite ease-in-out; /* Keep pulsing and bobbing */
}

#face-preview {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: none;
}


        /* Upload box */
        #upload-container {
            background-color: #001021; /* Dark blue */
            padding: 40px 30px;
            border-radius: 20px;
            text-align: center;
            color: #FFF;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            width: 300px;
            position: relative;
            z-index: 1;
            animation: electricPulse 2s infinite ease-in-out; /* Upload box will also keep pulsing */
            
        }

        #upload-container h2 {
            margin-bottom: 20px;
            font-size: 1.5rem;
        }

        input[type="file"] {
            padding: 10px;
            background-color: #ffffff;
            color: #000000;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.3s;
        }

        
        input[type="file"]:hover {
            background-color: #000000; 
            color: #ffffff;
        }

        .glass-button {
            margin-top: 20px;
            padding: 12px 30px;
            background-color: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 8px;
            color: #FFF;
            cursor: pointer;
            transition: background-color 0.3s, transform 0.3s ease;
        }

        .glass-button:hover {
            background-color: #00ffff; /* Lighter blue hover */
            transform: translateY(-10px); /* Slight lift on hover */
        }

        #loading {
            display: none;
            margin-top: 15px;
            font-size: 1.1rem;
            color: #00ffff;
        }

        /* Electric pulse animation for the circle and upload box */
        @keyframes electricPulse {
            0% {
                box-shadow: 0 0 15px rgba(0, 255, 255, 0.5), 0 0 30px rgba(0, 255, 255, 0.3), 0 0 60px rgba(0, 255, 255, 0.2);
            }
            50% {
                box-shadow: 0 0 30px rgba(0, 255, 255, 0.9), 0 0 60px rgba(0, 255, 255, 0.6), 0 0 90px rgba(0, 255, 255, 0.4);
            }
            100% {
                box-shadow: 0 0 15px rgba(0, 255, 255, 0.5), 0 0 30px rgba(0, 255, 255, 0.3), 0 0 60px rgba(0, 255, 255, 0.2);
            }
        }

        /* Bobbing animation for the face circle */
        @keyframes bob {
            0%, 100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.05); /* Slightly grow the circle */
            }
        }
        .bob-animation {
    animation: bob 10s infinite ease-in-out; /* تأثير البوب */
    }

        body::after {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    background-image: url('circuit-pattern.png'); /* Transparent circuit pattern */
    opacity: 0.05; /* Subtle opacity */
    z-index: 0;
    animation: circuitAnimation 15s linear infinite;
    }

    @keyframes circuitAnimation {
    0% { background-position: 0 0; }
    100% { background-position: 50px 100px; }
    }

    @keyframes twinkle {
    0% { opacity: 0.5; }
    50% { opacity: 1; }
    100% { opacity: 0.5; }
    }

  

  

        .star {
            position: absolute;
            width: 0.5px; /* Increased size for better visibility */
            height: 0.5px;
            background: white;
            border-radius: 50%;
            opacity: 0.8; /* Slightly more opaque */
            transition: transform 0.5s; /* Smooth movement */
        }
</style>


 


</head>
<body>
    <div class="custom-cursor"></div>
    
    <main>
        <!-- Circle for face preview -->
        <div id="face-preview-container">
            <img id="face-preview" src="DeepGuard (2).gif" alt="Uploaded face preview">
        </div>
        

        <!-- Upload Box -->
        <div id="upload-container">
            
            <h2>Deepfake Detection</h2>
            <form action="/" method="post" enctype="multipart/form-data">
                <input type="file" name="file" required>
                <input type="submit" value="Upload" class="glass-button">
            </form>
            <div id="loading">Detecting...</div>
        </div>
    </main>
    <audio autoplay loop></audio>
    <source src="final-effort-for-future-preview-full.mp3" type="audio/mp3">
</audio>
    <script>
        function showLoading() {
            document.getElementById("loading").style.display = "block"; // Show loading text
        }

        function previewFace(event) {
            const facePreview = document.getElementById('face-preview');
    const facePreviewContainer = document.getElementById('face-preview-container');

    facePreview.src = URL.createObjectURL(event.target.files[0]); // عرض الصورة
    facePreview.style.display = "block"; // إظهار دائرة الوجه

    // إضافة فئة البوب فقط بعد رفع الصورة
    facePreviewContainer.classList.add('bob-animation');
        }
        const createStars = () => {
            const numberOfStars = 300; // Number of stars
            const body = document.body;
            for (let i = 0; i < numberOfStars; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                star.style.left = `${Math.random() * 100}vw`; // Random horizontal position
                star.style.top = `${Math.random() * 100}vh`; // Random vertical position
                body.appendChild(star);
                star.dataset.originalX = star.style.left; // Store original position
                star.dataset.originalY = star.style.top; // Store original position
            }
        };

        setInterval(() => {
            const deltaX = (Math.random() - 0.5) * 10; // قيمة عشوائية للتحرك
            const deltaY = (Math.random() - 0.5) * 10; // قيمة عشوائية للتحرك
            const starRect = star.getBoundingClientRect();

            // تأكد من أن النجوم تتحرك داخل نافذة العرض
            if (starRect.left + deltaX > 0 && starRect.left + deltaX < window.innerWidth) {
                star.style.left = `${starRect.left + deltaX}px`;
            }
            if (starRect.top + deltaY > 0 && starRect.top + deltaY < window.innerHeight) {
                star.style.top = `${starRect.top + deltaY}px`;
            }
        }, 1000); // كل ثانية
    
        const moveStars = (event) => {
            const stars = document.querySelectorAll('.star');
            stars.forEach((star) => {
                const starX = star.offsetLeft + 2; // Center the star
                const starY = star.offsetTop + 2; // Center the star
                const deltaX = event.clientX - starX;
                const deltaY = event.clientY - starY;
                const distance = Math.sqrt(deltaX * deltaX + deltaY * deltaY);
                
                // Move the star towards the mouse if within a certain distance
                if (distance < 150) {
                    const angle = Math.atan2(deltaY, deltaX);
                    const moveX = Math.cos(angle) * 10; // Move speed
                    const moveY = Math.sin(angle) * 10; // Move speed
                    star.style.transform = `translate(${moveX}px, ${moveY}px)`;
                } else {
                    star.style.transform = 'translate(0, 0)'; // Reset position
                }
            });
        };

        createStars();
        document.addEventListener('mousemove', moveStars);
        document.addEventListener('mousemove', (e) => {
            const cursor = document.querySelector('.custom-cursor');
            cursor.style.left = `${e.pageX}px`;
            cursor.style.top = `${e.pageY}px`;
        });
    </script>

</body>
</html>
