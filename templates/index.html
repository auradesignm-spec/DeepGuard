<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Image - Gan2AI Deepfake Detection</title>
    <style>
          
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
          
        }
        body {
    cursor: url("{{ url_for('static', filename='cursor.png') }}"), auto;
    background-color: #0a0a0a;
    background-image: 
                      repeating-linear-gradient(0deg, rgba(255, 255, 255, 0.05), rgba(255, 255, 255, 0.05) 1px, transparent 1px, transparent 50px),
                      repeating-linear-gradient(90deg, rgba(255, 255, 255, 0.05), rgba(255, 255, 255, 0.05) 1px, transparent 1px, transparent 50px);
    background-size: cover; /* أو يمكن استخدام contain */
    background-repeat: no-repeat; /* عدم تكرار الخلفية */
    height: 100vh; /* ارتفاع الشاشة بالكامل */
    width: 100vw; /* عرض الشاشة بالكامل */
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    position: relative;
}
@keyframes flicker {
    0%, 100% { opacity: 1; }
    10% { opacity: 0.6; }
    20% { opacity: 0.2; }
    30% { opacity: 0.9; }
    40% { opacity: 0.3; }
    50% { opacity: 0.8; }
    60% { opacity: 0.5; }
    70% { opacity: 1; }
}

.shadow-cursor {
            position: fixed;
            width: 20px; /* عرض الظل */
            height: 20px; /* ارتفاع الظل */
            background-image: url("{{ url_for('static', filename='target.png') }}"); /* رابط صورة الظل */
            background-size: cover; /* تأكد من أن الصورة تغطي العنصر بالكامل */
            border-radius: 0%; /* شكل دائري */
            pointer-events: none; /* يمنع تداخل الظل مع الأحداث الأخرى */
            transform: translate(-50%, -50%); /* لجعل الظل في المركز */
            z-index: 9; /* تأكد من أنه تحت المؤشر */
            opacity: 1; /* شفافية الظل */
           
        }

h2 {
    animation: flicker 2.5s infinite alternate;
    text-shadow: 0 0 5px rgba(0, 255, 255, 0.7), 0 0 20px rgba(0, 255, 255, 0.4);
}


        main {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            position: relative;
            padding-top: 100px; /* Space for the circle */
        }

        #face-preview-container {
    width: 120px;
    height: 120px;
    background-image: url("{{ url_for('static', filename='DeepGuard (2).gif') }}"); /* Default face detection icon */
    background-size: cover;
    border-radius: 50%;
    border: 4px solid rgb(255, 255, 255); /* Electric blue */
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    position: absolute;
    top: 30px; /* Positioned above the box */
   
    z-index: 10;
    animation: electricPulse 2s infinite ease-in-out, bob 3s infinite ease-in-out; /* Keep pulsing and bobbing */
}

#face-preview {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: none;
}


#upload-container {
            
            background-color: transparent !important;
            padding: 20px 10px;
            border-radius: 20px;
            text-align: center;
            color: #FFF;
            box-shadow: none;
            width: 1200px;
            height: 400PX;
            position: relative;
            z-index: 1;
            
            bottom: -100px;
        }

        #upload-container h2 {
            margin-bottom: 20px;
            font-size: 1.5rem;
        }

        input[type="file"] {
            padding: 10px;
            background-color: #ffffff;
            color: #000000;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            width: 30%;
            transition: background-color 0.3s;
        }

        input[type="file"]:hover {
            background-color: #000000; 
            color: #ffffff;
        }

        .glass-button {
            margin-top: 20px;
            padding: 12px 30px;
            background-color: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 8px;
            color: #FFF;
            cursor: pointer;
            transition: background-color 0.3s, transform 0.3s ease;
        }

        .glass-button:hover {
            background-color: #00ffff; /* Lighter blue hover */
            transform: translateY(-10px); /* Slight lift on hover */
        }

        #loading {
            display: none;
            margin-top: 15px;
            font-size: 1.1rem;
            color: #00ffff;
        }

        /* Electric pulse animation for the circle and upload box */
        @keyframes electricPulse {
            0% {
                box-shadow: 0 0 15px rgba(0, 255, 255, 0.5), 0 0 30px rgba(0, 255, 255, 0.3), 0 0 60px rgba(0, 255, 255, 0.2);
            }
            50% {
                box-shadow: 0 0 30px rgba(0, 255, 255, 0.9), 0 0 60px rgba(0, 255, 255, 0.6), 0 0 90px rgba(0, 255, 255, 0.4);
            }
            100% {
                box-shadow: 0 0 15px rgba(0, 255, 255, 0.5), 0 0 30px rgba(0, 255, 255, 0.3), 0 0 60px rgba(0, 255, 255, 0.2);
            }
        }

        /* Bobbing animation for the face circle */
        @keyframes bob {
            0%, 100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.05); /* Slightly grow the circle */
            }
        }
        .bob-animation {
    animation: bob 10s infinite ease-in-out; /* تأثير البوب */
    }



    @keyframes circuitAnimation {
    0% { background-position: 0 0; }
    100% { background-position: 50px 100px; }
    }

    @keyframes twinkle {
    0% { opacity: 0.5; }
    50% { opacity: 1; }
    100% { opacity: 0.5; }
    }

  

  

        .star {
            position: absolute;
            width: 0.5px; /* Increased size for better visibility */
            height: 0.5px;
            background: white;
            border-radius: 50%;
            opacity: 0.8; /* Slightly more opaque */
            transition: transform 0.5s; /* Smooth movement */
        }

   
</style>
</style>


 


</head>
<body>
    <div class="shadow-cursor"></div>
    
    <main>
        
        <!-- Circle for face preview -->
        <div id="face-preview-container">
            <img id="face-preview" src="{{ url_for('static', filename='DeepGuard (2).gif') }}" alt="Uploaded face preview">
        </div>
        

        <!-- Upload Box -->
        <div id="upload-container">
            <h2>Upload an Image</h2>
            <form id="upload-form" action="/" method="post" enctype="multipart/form-data" onsubmit="showLoading()">
              
              
                    <input type="file" class="file-input" name="file" accept="image/*" required onchange="previewFace(event)">
               
                                <input type="submit" value="Upload" class="glass-button">
            </form>
            <div id="loading">Detecting...</div>
        </div>
    </main>
    <audio autoplay loop></audio>
    <source src="final-effort-for-future-preview-full.mp3" type="audio/mp3">
</audio>
    <script>
  document.addEventListener('mousemove', (e) => {
            const shadowCursor = document.querySelector('.shadow-cursor');
            shadowCursor.style.left = `${e.pageX}px`;
            shadowCursor.style.top = `${e.pageY}px`;
        });
        function showLoading() {
            document.getElementById("loading").style.display = "block"; // Show loading text
        }

        function previewFace(event) {
            const facePreview = document.getElementById('face-preview');
    const facePreviewContainer = document.getElementById('face-preview-container');

    facePreview.src = URL.createObjectURL(event.target.files[0]); // عرض الصورة
    facePreview.style.display = "block"; // إظهار دائرة الوجه

    // إضافة فئة البوب فقط بعد رفع الصورة
    facePreviewContainer.classList.add('bob-animation');
        }
       

        function createStars() {
            const starContainer = document.createElement('div');
            starContainer.classList.add('star-container');
            document.body.appendChild(starContainer);

            for (let i = 0; i < 100; i++) {
                const star = document.createElement('div');
                star.classList.add('star');
                const size = Math.random() * 3 + 1; // حجم النجمة عشوائي بين 1px و 4px
                star.style.width = `${size}px`;
                star.style.height = star.style.width;
                star.style.left = `${Math.random() * 100}vw`;
                star.style.top = `${Math.random() * 100}vh`;
                starContainer.appendChild(star);
            }

            const stars = document.querySelectorAll('.star');

            const moveStars = () => {
                stars.forEach((star) => {
                    const starRect = star.getBoundingClientRect();

                    // تحريك النجوم لأعلى
                    star.style.top = `${starRect.top - 2}px`; // سرعة الحركة لأعلى

                    // إعادة تعيين النجوم إلى الأسفل عند اختفائها
                    if (starRect.top < -10) {
                        star.style.top = `${window.innerHeight + Math.random() * 20}px`;
                        star.style.left = `${Math.random() * 100}vw`;
                    }

                    // تأثير التلاشي
                    const opacity = Math.max(0, (starRect.top + 10) / window.innerHeight);
                    star.style.opacity = opacity;
                });
            };

            setInterval(moveStars, 50); // كل 50 مللي ثانية
        }

        window.onload = createStars;

</body>
</html>
