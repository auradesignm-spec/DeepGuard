<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Image - Gan2AI Deepfake Detection</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            cursor: url("{{ url_for('static', filename='cursor.png') }}"), auto;
            background-color: #0a0a0a;
            background-image: 
                repeating-linear-gradient(0deg, rgba(255, 255, 255, 0.05), rgba(255, 255, 255, 0.05) 1px, transparent 1px, transparent 50px),
                repeating-linear-gradient(90deg, rgba(255, 255, 255, 0.05), rgba(255, 255, 255, 0.05) 1px, transparent 1px, transparent 50px);
            background-size: cover;
            height: 100vh;
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
        }

        h2 {
            animation: flicker 2.5s infinite alternate;
            font-size: 2rem;
        }

        .result-text {
            font-size: 2rem;
            margin-top: 20px;
        }

        main {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            padding: 2rem;
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            min-height: 100vh;
            text-align: center;
        }

        #upload-container {
            background-color: transparent;
            border-radius: 20px;
            color: #FFF;
            padding: 20px;
            margin-top: 50px;
            box-shadow: none;
        }

        .glass-button {
    padding: 10px 20px;
    background-color: rgba(255, 255, 255, 0.1);
    border: 2px solid rgba(255, 255, 255, 0.3);
    border-radius: 8px;
    color: #FFF;
    cursor: pointer;
    transition: background-color 0.3s, transform 0.3s ease, box-shadow 0.3s ease;
    margin-top: 20px;
    animation: bounce 1s ease infinite; /* Add animation on load */
}

.glass-button:hover {
    transform: scale(1.05);
    box-shadow: 0 0 15px rgba(255, 255, 255, 0.6);
}

.glass-button.real:hover {
    background-color: #00ff00;
    transform: scale(1.1);
}

.glass-button.fake:hover {
    background-color: #ff0000;
    transform: scale(1.1);
}

@keyframes bounce {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-10px); }
}


        #pie-chart {
            width: 400px;
            height: 400px;
            margin: 50px auto;
        }

        @keyframes flicker {
            0%, 100% { opacity: 1; }
            10% { opacity: 0.6; }
            20% { opacity: 0.2; }
            30% { opacity: 0.9; }
            40% { opacity: 0.3; }
            50% { opacity: 0.8; }
            60% { opacity: 0.5; }
            70% { opacity: 1; }
        }

        .shadow-cursor {
            position: fixed;
            width: 20px;
            height: 20px;
            background-image: url("{{ url_for('static', filename='target.png') }}");
            background-size: cover;
            pointer-events: none;
            transform: translate(-50%, -50%);
            z-index: 9;
        }
        .star {
            position: absolute;
            width: 0.5px; /* Increased size for better visibility */
            height: 0.5px;
            background: white;
            border-radius: 50%;
            opacity: 0.8; /* Slightly more opaque */
            transition: transform 0.5s; /* Smooth movement */
        }

    </style>
</head>
<body>
    <div class="shadow-cursor"></div>
    
    <main>
        <div id="upload-container">
            <h2 id="detection-results">Detection Results</h2>   
            <div id="result-text" class="result-text"></div>
            <p>Fake Probability: {{  fake_prob * 100 | round(2) }}%</p>
            <p>Real Probability: {{ real_prob * 100 | round(2) }}%</p>
            <canvas id="pie-chart" width="100" height="100"></canvas>
            
            <a href="{{ url_for('download_report') }}" class="glass-button">Download Report</a>
            <a href="/" class="glass-button">Try another image</a>
        </div>
    </main>

    <audio autoplay loop>
        <source src="final-effort-for-future-preview-full.mp3" type="audio/mp3">
    </audio>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>
        document.addEventListener('mousemove', (e) => {
            const shadowCursor = document.querySelector('.shadow-cursor');
            shadowCursor.style.left = `${e.pageX}px`;
            shadowCursor.style.top = `${e.pageY}px`;
        });

        // قراءة القيم المرسلة من Flask
        const fake_prob = JSON.parse('{{ (fake_prob * 100) | tojson }}');
        const real_prob = JSON.parse('{{ (real_prob * 100) | tojson }}');
        const fake_prob_percent = Math.round(fake_prob);
        const real_prob_percent = Math.round(real_prob);

        const resultHeading = document.getElementById('detection-results');
    
        // تغيير النص ولونه حسب النتيجة
        if (real_prob_percent > fake_prob_percent) {
            resultHeading.textContent = 'Real';
            resultHeading.style.color = '#00ff00'; // لون أخضر
        } else {
            resultHeading.textContent = 'Fake';
            resultHeading.style.color = '#ff0000'; // لون أحمر
        }

        const ctx = document.getElementById('pie-chart').getContext('2d');
        const pieChart = new Chart(ctx, {
            type: 'doughnut',
            data: {
                labels: ['Fake', 'Real'],
                datasets: [{
                    data: [fake_prob, real_prob],
                    backgroundColor: ['#ff0000', '#00ff00'],
                    borderColor: ['#ffffff', '#ffffff'],
                    borderWidth: 2,
                }]
            },
            options: {
                responsive: true,
                plugins: {
                    legend: {
                        position: 'top',
                        labels: {
                            font: {
                                size: 24,
                                weight: 'bold',
                            },
                        }
                    },
                    tooltip: {
                        callbacks: {
                            label: function(tooltipItem) {
                                return tooltipItem.label + ': ' + Math.round(tooltipItem.raw) + '%';
                            }
                        }
                    }
                }
            }
        });
                function createStars() {
            const starContainer = document.createElement('div');
            starContainer.classList.add('star-container');
            document.body.appendChild(starContainer);

            for (let i = 0; i < 100; i++) {
                const star = document.createElement('div');
                star.classList.add('star');
                const size = Math.random() * 3 + 1; // حجم النجمة عشوائي بين 1px و 4px
                star.style.width = `${size}px`;
                star.style.height = star.style.width;
                star.style.left = `${Math.random() * 100}vw`;
                star.style.top = `${Math.random() * 100}vh`;
                starContainer.appendChild(star);
            }

            const stars = document.querySelectorAll('.star');

            const moveStars = () => {
                stars.forEach((star) => {
                    const starRect = star.getBoundingClientRect();

                    // تحريك النجوم لأعلى
                    star.style.top = `${starRect.top - 2}px`; // سرعة الحركة لأعلى

                    // إعادة تعيين النجوم إلى الأسفل عند اختفائها
                    if (starRect.top < -10) {
                        star.style.top = `${window.innerHeight + Math.random() * 20}px`;
                        star.style.left = `${Math.random() * 100}vw`;
                    }

                    // تأثير التلاشي
                    const opacity = Math.max(0, (starRect.top + 10) / window.innerHeight);
                    star.style.opacity = opacity;
                });
            };

            setInterval(moveStars, 50); // كل 50 مللي ثانية
        }

        window.onload = createStars;

                    if (starRect.top < -10) {

                    }

                    // تأثير التلاشي
                    const opacity = Math.max(0, (starRect.top + 10) / window.innerHeight);

        window.onload = createStars;
    </script>
</body>
</html>
